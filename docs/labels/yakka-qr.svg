<!--
  Yakka tag label: QR scan (Labelync template)

  40 x 60 mm portrait label at 203 dpi (320 x 480 px), laid out like the
  labels on Yakka's print sheet. Paste the tag's link from Yakka (Tags > Copy link) into "Tag URL".
  Copy the link into "URL" too to print it in small type, or hide that field.
  Everything prints in solid black for thermal printers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480">
  <rect width="320" height="480" fill="white"/>

  <!-- QR code: 34 mm square -->
  <rect
    id="tag_url"
    x="24"
    y="20"
    width="272"
    height="272"
    fill="#f0f0f0"
    stroke="#999"
    stroke-width="1"
    data-field-type="qr"
    data-label="Tag URL"
    data-qr-version="auto"
    data-qr-error-correction="M"/>

  <!-- Chore title (add the chore's emoji in front if you like) -->
  <text
    id="chore"
    x="160"
    y="330"
    font-size="26"
    font-weight="bold"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    fill="black"
    data-field-type="text"
    data-label="Chore"
    data-autosize-max-width="288">
    Empty the dishwasher
  </text>

  <!-- Tag label, e.g. where the tag is stuck -->
  <text
    id="tag_label"
    x="160"
    y="356"
    font-size="16"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    fill="black"
    data-field-type="text"
    data-label="Tag label"
    data-autosize-max-width="288"
    data-optional="true">
    Kitchen
  </text>

  <!-- Scan / Tap badges -->
  <rect x="119.0" y="368" width="82" height="28" rx="14" fill="none" stroke="black" stroke-width="2"/>
  <g transform="translate(131.0 373) scale(0.75)" fill="none" stroke="black" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></g>
  <text x="155.0" y="387.5" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="black">Scan</text>

  <!-- How to use it -->
  <text
    id="hint"
    x="160"
    y="424"
    font-size="15"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    fill="black"
    data-field-type="text"
    data-label="Hint"
    data-autosize-max-width="288">
    Scan with your phone camera to tick off
  </text>

  <!-- Tag URL in small type -->
  <text
    id="url"
    x="160"
    y="456"
    font-size="12"
    text-anchor="middle"
    font-family="Courier New, monospace"
    fill="black"
    data-field-type="text"
    data-label="URL"
    data-autosize-max-width="288"
    data-optional="true">
    https://yakka.nectric.com.au/t/k7mq2xrv9wtd
  </text>
</svg>
