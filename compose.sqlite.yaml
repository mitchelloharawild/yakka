# Single container with SQLite in a volume (homelab). See docs/DEPLOYMENT.md.
#   docker compose -f compose.sqlite.yaml up -d
name: yakka-sqlite

services:
  app:
    image: ghcr.io/mitchelloharawild/yakka:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/yakka.db
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ENABLE_INTERNAL_CRON: "true"
      RATE_LIMIT_PROXY_HOPS: ${RATE_LIMIT_PROXY_HOPS:-1}
    volumes:
      - data:/data

volumes:
  data:
